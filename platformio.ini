; PlatformIO Project Configuration File for ESP32-S3 Flight Controller
; Board: ESP32-S3-DevKitC-1 (R16N8: 16MB Flash, 8MB Octal PSRAM)
; Framework: Arduino

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial & Upload settings
monitor_speed = 115200
upload_speed = 921600
monitor_dtr = 0
monitor_rts = 0

; Board specs: ESP32-S3 N16R8 (16MB Flash, 8MB Octal PSRAM)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Build Flags (Cấu hình cho cổng UART CH343 / CP2102)
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=0
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -I include

; Library Dependencies (Wire, WiFi, WebServer are built-in)
lib_deps =
    links2004/WebSockets @ ^2.4.1

; ==============================================================================
; ENVIRONMENT: I2C SCANNER & HARDWARE VERIFICATION (BƯỚC 1)
; ==============================================================================
[env:i2c_scanner]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_dtr = 0
monitor_rts = 0
build_src_filter = +<../tools/i2c_scanner/*> -<*>
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=0
    -D CORE_DEBUG_LEVEL=3

